<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="自動の遅延表示と、直前の動きをスローで見返す体育用アプリ。登録不要・広告なし・映像は端末内だけ。">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
  <title>10秒リプレイ｜体育の動きを見返す</title>
</head>
<body>
  <header><h1>10秒リプレイ</h1><p id="mode-hint" class="mode-hint">10秒後に自動再生</p></header>
  <main id="app">
    <fieldset class="mode-choice"><legend>見る方法</legend><div class="segmented">
      <button type="button" data-mode="delay" aria-pressed="true"><span class="mode-name" id="delay-name">10秒おくれて再生</span><span class="mode-help">選んだ秒数あとに映る</span></button>
      <button type="button" data-mode="slow" aria-pressed="false"><span class="mode-name" id="slow-name">直前10秒をスロー再生</span><span class="mode-help">動いたあと「見る」を押す</span></button>
    </div></fieldset>
    <div class="settings" aria-label="映像の設定">
      <label for="seconds">時間 <select id="seconds"><option value="5">5秒</option><option value="10" selected>10秒</option><option value="15">15秒</option></select></label>
      <label for="quality">画質 <select id="quality"><option value="standard">標準</option><option value="light">低め</option></select></label>
      <label class="check-label"><input id="mirror" type="checkbox">左右反転</label>
      <button id="switch" type="button" disabled>カメラ切替</button>
    </div>
    <section id="viewer" class="viewer" aria-label="動きを見る画面">
      <div class="viewport" id="viewport">
        <canvas id="display" width="480" height="270" aria-label="動きの映像"></canvas>
        <div class="empty" id="empty" hidden><p id="empty-text"></p></div>
        <p class="view-state" id="view-state" hidden></p>
      </div>
      <div id="review-controls" hidden>
        <label class="seek-label" for="seek">見たいところへ <span id="clip-time"></span></label>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="映像の再生位置（秒）">
      </div>
      <div class="controls" aria-label="カメラと再生の操作">
        <button id="start" class="primary" type="button">はじめる</button>
        <button id="watch" class="primary" type="button" hidden>直前10秒を見る</button>
        <button id="again" type="button" hidden>もう一度</button>
        <button id="pause" type="button" hidden>とめる</button>
        <label id="speed-setting" hidden>速さ <select id="speed"><option value="1">1倍</option><option value="0.5" selected>0.5倍</option><option value="0.25">0.25倍</option></select></label>
        <button id="fullscreen" type="button" aria-pressed="false">映像を大きく</button>
        <button id="end" class="danger" type="button" disabled>おわる</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
    </section>
    <details id="about"><summary>このアプリについて</summary>
      <p>無料・広告なし。映像は端末内で処理。音声収録・保存・外部送信なし。</p>
      <p>配信サービスにはアクセスログが残ります。</p>
      <p>試用版 v0.3.3</p>
    </details>
  </main>
  <noscript><p>JavaScriptを有効にしてください。</p></noscript>
  <video id="source" muted playsinline aria-hidden="true"></video>
</body>
</html>
